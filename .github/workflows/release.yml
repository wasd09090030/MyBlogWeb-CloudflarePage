name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: both
        type: choice
        options: [nuxt-admin, nuxt-public, both]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-api:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'nuxt-admin' ||
      github.event.inputs.target == 'nuxt-public' ||
      github.event.inputs.target == 'both'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxt-admin
    env:
      BLOG_DB_NAME: ${{ vars.BLOG_DB_NAME || 'blog-db' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nuxt-admin/package-lock.json
      - run: npm ci
      - run: npm run check:free-config
      - run: npm run check:image-api
      - run: npm run check:image-transform
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$BLOG_DB_NAME" --remote --config wrangler.toml
      - name: Build blog-api Worker
        env:
          NODE_ENV: production
        run: npm run build:api
      - name: Deploy blog-api Worker
        run: npx wrangler deploy --config wrangler.toml

  deploy-admin-pages:
    needs: deploy-api
    if: needs.deploy-api.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxt-admin
    env:
      NUXT_PUBLIC_ADMIN_ORIGIN: https://wasd09090030.top
      ADMIN_PAGES_PROJECT_NAME: ${{ vars.ADMIN_PAGES_PROJECT_NAME || 'myblog-admin' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nuxt-admin/package-lock.json
      - run: npm ci
      - run: npm run generate
      - name: Deploy Admin Pages artifact
        run: npx wrangler pages deploy .output/public --project-name="$ADMIN_PAGES_PROJECT_NAME"

  deploy-router:
    needs: deploy-admin-pages
    if: needs.deploy-admin-pages.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Deploy blog-router Worker
        run: npx wrangler deploy --config wrangler.toml

  deploy-public:
    needs: deploy-router
    if: needs.deploy-router.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxt-public
    env:
      NUXT_PUBLIC_API_BASE_URL: /api
      NUXT_API_BASE_URL: https://wasd09090030.top/api
      NUXT_PUBLIC_SITE_URL: https://wasd09090030.top
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME || 'myblogweb-cloudflarepage' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nuxt-public/package-lock.json
      - run: npm ci
      - run: npm run generate
      - name: Deploy public Pages artifact
        run: npx wrangler pages deploy .output/public --project-name="$PAGES_PROJECT_NAME"
