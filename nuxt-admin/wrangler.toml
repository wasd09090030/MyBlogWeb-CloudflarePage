name = "blog-api"
main = ".output/server/index.mjs"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

[vars]
ADMIN_ORIGIN = "https://wasd09090030.top"
PUBLIC_SITE_ORIGIN = "https://wasd09090030.top"
PUBLIC_ASSET_ORIGIN = "https://cfimg.wasd09090030.top"
IMAGE_API_BASE_URL = "https://cfimg.wasd09090030.top"
DEFAULT_UPLOAD_FOLDER = "uploads"
PAGES_PROJECT_NAME = "myblogweb-cloudflarepage"

[[d1_databases]]
binding = "BLOG_DB"
database_name = "blog-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Optional: configure after the first production cutover for login abuse controls.
# [[kv_namespaces]]
# binding = "ADMIN_RATE_LIMIT"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
