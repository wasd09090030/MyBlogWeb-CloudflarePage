name = "blog-router"
main = "router.js"
compatibility_date = "2026-07-28"

[vars]
PUBLIC_PAGES_ORIGIN = "https://myblogweb-cloudflarepage.pages.dev"
ADMIN_PAGES_ORIGIN = "https://myblog-admin-8n8.pages.dev"

[[services]]
binding = "BLOG_API"
service = "blog-api"

# Steam 快照同步：每天一次，转发到 blog-api 的 /api/steam/sync。
# Cron 只支持 UTC：21:00 UTC = 次日 05:00（Asia/Shanghai）。
# 单轮上游请求预算 40（Free 计划 50 次子请求上限），成就按「近两周在玩 + 陈旧度」轮转，
# 库内数据只写变化的行，避免每天把整库重写一遍。
[triggers]
crons = ["0 21 * * *"]

# 需要配置 Secret：npx wrangler secret put STEAM_SYNC_TOKEN --config wrangler.toml
# 该值必须与 blog-api 的 STEAM_SYNC_TOKEN 完全一致。

# Workers Routes should bind this Worker to the public hostname.
# Deploy blog-api and both Pages projects before deploying this Worker.
