name = "blog-router"
main = "router.js"
compatibility_date = "2026-07-28"

[vars]
PAGES_ORIGIN = "https://myblogweb-cloudflarepage.pages.dev"

[[services]]
binding = "BLOG_ADMIN"
service = "blog-admin"

# Workers Routes should bind this Worker to the public hostname.
# Deploy blog-admin before deploying this Worker so the Service Binding resolves.
