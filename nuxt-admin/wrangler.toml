name = "blog-api"
main = ".output/server/index.mjs"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

[cache]
enabled = true

[images]
binding = "IMAGES"

[vars]
ADMIN_ORIGIN = "https://wasd09090030.top"
PUBLIC_SITE_ORIGIN = "https://wasd09090030.top"
PUBLIC_ASSET_ORIGIN = "https://cfimg.wasd09090030.top"
IMAGE_API_BASE_URL = "https://cfimg.wasd09090030.top"
DEFAULT_UPLOAD_FOLDER = "uploads"
PAGES_PROJECT_NAME = "myblogweb-cloudflarepage"

# Steam 游戏档案（公开站 /games）：填入 17 位 SteamID64；API key 用 secret 存。
# STEAM_ID = "7656119xxxxxxxxxx"
# npx wrangler secret put STEAM_API_KEY --config wrangler.toml
# npx wrangler secret put STEAM_SYNC_TOKEN --config wrangler.toml
# cron 触发器在 cloudflare-worker/wrangler.toml（Nitro 产物只有 fetch 导出）。

[[d1_databases]]
binding = "BLOG_DB"
database_name = "blog-db"
database_id = "126c95b1-c3b3-468c-9431-df69501510d3"
migrations_dir = "migrations"

# Optional: configure after the first production cutover for login abuse controls.
# [[kv_namespaces]]
# binding = "ADMIN_RATE_LIMIT"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
